<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Desculpas Absurdas e Sem Sentido</title>
<meta name="description" content="Gerador de desculpas absurdas e plausíveis, com nível de absurdo e credibilidade. Divirta-se criando justificativas ridículas que fazem sentido!">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#000;
color:#00ffee;
font-family:monospace;
text-align:center;
transition:0.3s;
}

h1{
text-shadow:0 0 20px #ff00ff;
margin-bottom:10px;
}

#frase{
max-width:850px;
margin:20px;
min-height:100px;
font-size:1.2em;
line-height:1.4em;
}

button{
padding:10px 20px;
margin:5px;
background:#000;
color:#00ffee;
border:2px solid #ff00ff;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}
button:hover{
background:#ff00ff;
color:#000;
}

.barra{
width:300px;
height:15px;
border:2px solid #ff00ff;
margin:5px;
}

.preenchimento{
height:100%;
width:0%;
background:red;
transition:.3s;
}

#copyButton{
border-color:#00ff00;
color:#00ff00;
}
#copyButton:hover{
background:#00ff00;
color:#000;
}

#shareButton{
border-color:#ff9900;
color:#ff9900;
}
#shareButton:hover{
background:#ff9900;
color:#000;
}
</style>
</head>

<body>

<h1>🤖 GERADOR DE DESCULPAS ABSURDAS</h1>

<p id="frase">Clique em GERAR para criar uma desculpa absurda!</p>

🔥 Absurdo: <span id="nivel">0</span>
<div class="barra"><div id="barraA" class="preenchimento"></div></div>

🎭 Credibilidade: <span id="cred">0</span>
<div class="barra"><div id="barraC" class="preenchimento"></div></div>

<div>
<button onclick="gerar()">GERAR</button>
<button id="copyButton" onclick="copiar()">COPIAR</button>
<button id="shareButton" onclick="compartilhar()">COMPARTILHAR</button>
</div>

<script>
function escolher(a){ return a[Math.floor(Math.random()*a.length)]; }

function gerar(){
let absurdo=Math.floor(Math.random()*101);

let inicio=[
"Eu realmente não queria que isso acontecesse, mas",
"Eu tentei resolver antes, porém",
"Isso parece mentira, mas"
];

let causaBase=[
"meu celular descarregou",
"o ônibus atrasou",
"meu vizinho causou um problema",
"houve um imprevisto aqui em casa",
"meu peixe morreu afogado e",
"precisei levar minha avó do jiu-jitsu"
];

let eventoLeve=[
"e acabou atrasando tudo.",
"e perdi completamente o horário.",
"e precisei reorganizar tudo de última hora."
];

let eventoMedio=[
"e precisei acompanhar a situação pessoalmente.",
"e fiquei preso resolvendo isso por horas.",
"e precisei ajudar a resolver imediatamente."
];

let eventoAlto=[
"porque o prédio inteiro precisou ser evacuado temporariamente.",
"porque acabou envolvendo outras pessoas inesperadamente.",
"porque virou uma situação completamente fora do controle."
];

let detalheAbsurdo=[
"aparentemente alguém confundiu meu número com o de um técnico oficial.",
"o síndico decidiu me envolver na resolução.",
"acabaram achando que eu era responsável pela situação.",
"ninguém mais sabia como resolver."
];

let frase=escolher(inicio)+" "+escolher(causaBase)+" ";

if(absurdo<40){
frase+=escolher(eventoLeve);
}
else if(absurdo<75){
frase+=escolher(eventoMedio)+" "+escolher(detalheAbsurdo)+".";
}
else{
frase+=escolher(eventoAlto)+" "+escolher(detalheAbsurdo)+" e eu tive que assumir a responsabilidade temporariamente.";
}

// Detector simples de frase estranha
if(frase.split(" ").length<12){ gerar(); return; }

// Credibilidade baseada no absurdo
let cred=100-absurdo+Math.floor(Math.random()*10-5);
cred=Math.max(0, Math.min(cred,100));

document.getElementById("frase").innerText=frase;
document.getElementById("nivel").innerText=absurdo;
document.getElementById("cred").innerText=cred;
document.getElementById("barraA").style.width=absurdo+"%";
document.getElementById("barraC").style.width=cred+"%";
}

// Copiar para área de transferência
function copiar(){
let texto=document.getElementById("frase").innerText;
navigator.clipboard.writeText(texto).then(()=>{
alert("Desculpa copiada!");
});
}

// Compartilhar (link ou redes sociais)
function compartilhar(){
let texto=encodeURIComponent(document.getElementById("frase").innerText);
let url=`https://twitter.com/intent/tweet?text=${texto}`;
window.open(url, "_blank");
}
</script>

</body>
</html>
