<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>IA de Desculpas Absurdas e Sem Sentido</title>
<meta name="description" content="Gerador de desculpas absurdas e plausíveis, com nível de absurdo e credibilidade. Divirta-se criando justificativas ridículas!">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:black;
color:#00ffee;
font-family:monospace;
}

h1{ text-shadow:0 0 15px #ff00ff; }

#frase{
max-width:850px;
text-align:center;
margin:20px;
min-height:90px;
}

button{
padding:10px 20px;
background:black;
color:#00ffee;
border:2px solid #ff00ff;
cursor:pointer;
}

.barra{
width:300px;
height:15px;
border:2px solid #ff00ff;
margin:5px;
}

.preenchimento{
height:100%;
width:0%;
background:red;
transition:.3s;
}
</style>
</head>

<body>

<h1> GERADOR DE DESCULPAS ABSURDAS E SEM SENTIDO</h1>

<p id="frase">Clique para gerar.</p>

🔥 Absurdo: <span id="nivel">0</span>
<div class="barra"><div id="barraA" class="preenchimento"></div></div>

🎭 Credibilidade: <span id="cred">0</span>
<div class="barra"><div id="barraC" class="preenchimento"></div></div>

<button onclick="gerar()">GERAR</button>

<script>
function escolher(a){ return a[Math.floor(Math.random()*a.length)]; }

function gerar(){
let absurdo=Math.floor(Math.random()*101);

let inicio=[
"Eu realmente não queria que isso acontecesse, mas",
"Eu tentei resolver antes, porém",
"Isso parece mentira, mas"
];

let causaBase=[
"meu celular descarregou",
"o ônibus atrasou",
"meu vizinho causou um problema",
"houve um imprevisto aqui em casa",
"meu peixe morreu afogado e",
"precisei levar minha avó do jiu-jitsu"
];

let eventoLeve=[
"e acabou atrasando tudo.",
"e perdi completamente o horário.",
"e precisei reorganizar tudo de última hora."
];

let eventoMedio=[
"e precisei acompanhar a situação pessoalmente.",
"e fiquei preso resolvendo isso por horas.",
"e precisei ajudar a resolver imediatamente."
];

let eventoAlto=[
"porque o prédio inteiro precisou ser evacuado temporariamente.",
"porque acabou envolvendo outras pessoas inesperadamente.",
"porque virou uma situação completamente fora do controle."
];

let detalheAbsurdo=[
"aparentemente alguém confundiu meu número com o de um técnico oficial.",
"o síndico decidiu me envolver na resolução.",
"acabaram achando que eu era responsável pela situação.",
"ninguém mais sabia como resolver."
];

let frase=escolher(inicio)+" "+escolher(causaBase)+" ";

if(absurdo<40){
frase+=escolher(eventoLeve);
}
else if(absurdo<75){
frase+=escolher(eventoMedio)+" "+escolher(detalheAbsurdo)+".";
}
else{
frase+=escolher(eventoAlto)+" "+escolher(detalheAbsurdo)+" e eu tive que assumir a responsabilidade temporariamente.";
}

// Detector simples de frase estranha
if(frase.split(" ").length<12){ gerar(); return; }

// Credibilidade baseada no absurdo
let cred=100-absurdo+Math.floor(Math.random()*10-5);
if(cred<0) cred=0;
if(cred>100) cred=100;

document.getElementById("frase").innerText=frase;
document.getElementById("nivel").innerText=absurdo;
document.getElementById("cred").innerText=cred;
document.getElementById("barraA").style.width=absurdo+"%";
document.getElementById("barraC").style.width=cred+"%";
}
</script>

</body>
</html>
